name: ✅ test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: utooland/setup-utoo@copilot/fix-fc58bf4b-44ab-4b95-bc26-995e14347557
        with:
          utoo-version: 'latest'
          registry: 'https://registry.npmmirror.com/'
          cache-store: true
      - run: ut
      - run: ut prestart
      - run: ut lint
      - run: ut tsc
      - run: ut compile
      - run: ut coverage
      - run: ut test:dekko
      - uses: codecov/codecov-action@v5
        with:
          directories: packages/x,packages/x-markdown,packages/x-sdk
          token: ${{ secrets.CODECOV_TOKEN }}
